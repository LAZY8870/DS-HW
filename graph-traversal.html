<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#edf2f6">
  <title>圖形走訪｜BFS 與 DFS</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #24384b;
      --muted: #728496;
      --paper: #edf2f6;
      --white: #fff;
      --blue: #3478a0;
      --teal: #258b78;
      --orange: #c86b34;
      --line: #dce5eb;
      --shadow: 0 3px 12px #29475d12, 0 12px 28px #29475d0a;
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: var(--ink); background: var(--paper); font-family: "Microsoft JhengHei", "PingFang TC", sans-serif; }
    button, select { font: inherit; }
    button { color: inherit; }
    .page { width: min(1360px, 100%); margin: auto; padding: 18px 26px 32px; }
    .nav { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 15px; padding: 0 4px 10px; }
    .nav a { color: var(--blue); font-size: 12px; font-weight: 700; text-decoration: none; }
    .nav a:hover { text-decoration: underline; }
    .toolbar, .controls, .panel { border: 1px solid #e0e7ed; border-radius: 9px; background: var(--white); box-shadow: var(--shadow); }
    .toolbar { display: flex; min-height: 68px; align-items: center; justify-content: space-between; gap: 16px; padding: 13px 18px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark { display: grid; width: 40px; height: 40px; place-items: center; border-radius: 8px; color: #fff; background: var(--ink); font-size: 12px; font-weight: 900; }
    h1 { margin: 0; font-size: 20px; }
    .subtitle { margin-top: 4px; color: var(--muted); font-size: 11px; }
    .graph-facts { padding: 9px 12px; border-radius: 6px; background: #e8eef3; color: var(--muted); font-size: 11px; white-space: nowrap; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; padding: 12px 16px; }
    .control-group { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .control-label { color: var(--muted); font-size: 11px; }
    .segmented { display: inline-flex; gap: 3px; padding: 4px; border-radius: 99px; background: #e8eef3; }
    .segmented button { min-height: 32px; padding: 0 13px; border: 0; border-radius: 99px; background: transparent; cursor: pointer; font-size: 11px; font-weight: 800; }
    .segmented button[aria-pressed="true"] { background: #fff; box-shadow: 0 1px 5px #29475d1a; }
    select { height: 38px; padding: 0 30px 0 10px; border: 1px solid #d1dce4; border-radius: 5px; background: #fff; color: var(--ink); font-size: 12px; }
    .button { min-height: 38px; padding: 0 13px; border: 0; border-radius: 5px; background: #e7edf2; cursor: pointer; font-size: 11px; font-weight: 800; white-space: nowrap; }
    .button:hover:not(:disabled) { background: #dce6ec; }
    .button:disabled { cursor: not-allowed; opacity: .48; }
    .button-primary { color: #fff; background: var(--blue); }
    .button-primary:hover:not(:disabled) { background: #285f80; }
    .button-dark { color: #fff; background: var(--ink); }
    .workspace { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; margin-top: 12px; align-items: start; }
    .panel { min-width: 0; padding: 14px; }
    .panel-heading { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
    h2 { margin: 0; font-size: 13px; }
    .meta { color: var(--muted); font-size: 10px; white-space: nowrap; }
    .graph-stage { display: grid; height: clamp(390px, 62vh, 490px); overflow: auto; place-items: center; border: 1px solid #d0dbe4; border-radius: 6px; background: #dce5ed; }
    .graph-stage svg { display: block; width: 100%; min-width: 620px; height: 100%; }
    .edge { stroke: #9fb1bf; stroke-width: 2.5; }
    .edge.active { stroke: var(--orange); stroke-width: 4; }
    .edge.visited { stroke: var(--teal); stroke-width: 3.2; }
    .node { fill: #fff; stroke: #bacbd7; stroke-width: 2; filter: drop-shadow(0 2px 1px #29475d12); }
    .node.discovered { fill: #fff0d9; stroke: var(--orange); stroke-width: 3; }
    .node.visited { fill: #d8eee5; stroke: var(--teal); stroke-width: 3; }
    .node.current { fill: #d9eafb; stroke: var(--blue); stroke-width: 3.5; }
    .node-label { fill: var(--ink); font-size: 17px; font-weight: 900; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .legend { display: flex; flex-wrap: wrap; gap: 14px; padding: 11px 0 5px; color: var(--muted); font-size: 10px; }
    .legend-item { display: inline-flex; align-items: center; gap: 6px; }
    .dot { width: 9px; height: 9px; border: 2px solid var(--blue); border-radius: 50%; background: #d9eafb; }
    .dot.visited { border-color: var(--teal); background: #d8eee5; }
    .dot.discovered { border-color: var(--orange); background: #fff0d9; }
    .playback { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; padding-top: 8px; }
    .progress { height: 5px; min-width: 60px; flex: 1; overflow: hidden; border-radius: 5px; background: #e5ebef; }
    .progress-fill { width: 0; height: 100%; background: var(--orange); transition: width .2s ease; }
    .step-count { color: var(--muted); font-size: 10px; white-space: nowrap; }
    .side { display: flex; flex-direction: column; gap: 12px; }
    .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin: 10px 0 13px; }
    .metric { padding: 9px; border-radius: 5px; background: #e8eef3; color: var(--muted); font-size: 10px; }
    .metric strong { display: block; margin-top: 4px; color: var(--ink); font-size: 15px; overflow-wrap: anywhere; }
    .info-label { display: block; margin: 10px 0 5px; color: var(--muted); font-size: 10px; }
    .info-strip { min-height: 34px; padding: 9px; overflow-wrap: anywhere; border-radius: 5px; background: #edf2f6; color: var(--ink); font-size: 11px; font-weight: 700; line-height: 1.5; }
    .note { min-height: 32px; margin: 8px 0 0; color: var(--muted); font-size: 10px; line-height: 1.6; }
    .history-panel { display: flex; max-height: 330px; min-height: 190px; flex-direction: column; }
    .history { display: flex; min-height: 0; flex-direction: column; gap: 4px; overflow: auto; }
    .history-row { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 6px; padding: 6px 7px; border-radius: 4px; background: #e9eef3; color: #52697a; font-size: 10px; }
    .history-row.active { outline: 2px solid #a8bfcd; background: #dce7ee; }
    .history-index { color: var(--blue); font-family: Consolas, monospace; font-weight: 900; }
    .message { min-height: 16px; margin: 7px 0 0; color: var(--muted); font-size: 10px; }
    @media (max-width: 820px) { .page { padding: 12px; } .workspace { grid-template-columns: 1fr; } .side { display: grid; grid-template-columns: 1fr 1fr; align-items: start; } .history-panel { max-height: 280px; } }
    @media (max-width: 560px) { .toolbar { align-items: flex-start; flex-direction: column; } .controls { align-items: flex-start; flex-direction: column; } .side { grid-template-columns: 1fr; } .graph-stage { height: 360px; } .graph-stage svg { min-width: 580px; height: 360px; } }
  </style>
</head>
<body>
  <main class="page">
    <nav class="nav" aria-label="其他作業"><a href="index.html">二元搜尋樹</a><a href="max-heap.html">最大堆積樹</a><a href="hash-table.html">雜湊表</a><a href="haida-restaurant-queue.html">海大餐廳排隊系統</a></nav>
    <header class="toolbar">
      <div class="brand"><div class="brand-mark" aria-hidden="true">G6</div><div><h1>圖形走訪</h1><div class="subtitle">GRAPH TRAVERSAL · BFS &amp; DFS</div></div></div>
      <div class="graph-facts">6 個頂點 · 9 條無向邊</div>
    </header>
    <section class="controls" aria-label="走訪設定">
      <div class="control-group"><span class="control-label">演算法</span><div class="segmented" role="group" aria-label="選擇走訪演算法"><button id="bfs-button" type="button" aria-pressed="true">BFS 廣度優先</button><button id="dfs-button" type="button" aria-pressed="false">DFS 深度優先</button></div></div>
      <div class="control-group"><label class="control-label" for="start-vertex">起點</label><select id="start-vertex" aria-label="選擇起點"><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option><option>F</option></select><button class="button button-primary" id="start-button" type="button">開始走訪</button></div>
    </section>
    <div class="workspace">
      <section class="panel" aria-labelledby="graph-heading">
        <div class="panel-heading"><h2 id="graph-heading">無向圖</h2><span class="meta">線段代表邊 · 同層鄰點依邊輸入順序走訪</span></div>
        <div class="graph-stage" id="graph-stage" role="img" aria-label="包含 A 到 F 六個頂點和九條無向邊的圖形"><svg id="graph-svg" viewBox="0 0 700 480" aria-hidden="true"></svg></div>
        <div class="legend"><span class="legend-item"><i class="dot" aria-hidden="true"></i>目前頂點</span><span class="legend-item"><i class="dot discovered" aria-hidden="true"></i>待走訪</span><span class="legend-item"><i class="dot visited" aria-hidden="true"></i>已走訪</span></div>
        <div class="playback" aria-label="步驟控制"><button class="button" id="previous-button" type="button" disabled>← 上一步</button><button class="button" id="next-button" type="button" disabled>下一步 →</button><button class="button button-dark" id="play-button" type="button" disabled>▶ 自動播放</button><button class="button" id="reset-button" type="button" disabled>重設走訪</button><div class="progress"><div class="progress-fill" id="progress-fill"></div></div><span class="step-count" id="step-count">0 / 0</span></div>
      </section>
      <aside class="side">
        <section class="panel" aria-labelledby="state-heading"><div class="panel-heading"><h2 id="state-heading">走訪狀態</h2><span class="meta" id="algorithm-label">BFS</span></div><div class="summary"><div class="metric">目前頂點<strong id="current-node">—</strong></div><div class="metric">已走訪<strong id="visited-count">0 / 6</strong></div></div><span class="info-label" id="frontier-label">佇列（下一個先走）</span><div class="info-strip" id="frontier-list">—</div><span class="info-label">走訪順序</span><div class="info-strip" id="order-list">尚未開始</div><p class="note" id="step-note" aria-live="polite">選擇 BFS 或 DFS 和起點，再開始走訪。</p></section>
        <section class="panel history-panel" aria-labelledby="history-heading"><div class="panel-heading"><h2 id="history-heading">走訪步驟</h2><span class="meta" id="history-count">0 步</span></div><div class="history" id="history-list" aria-live="polite"></div></section>
      </aside>
    </div>
  </main>
  <script>
    const VERTICES = ["A", "B", "C", "D", "E", "F"];
    const EDGES = [["A", "B"], ["A", "C"], ["B", "D"], ["C", "E"], ["D", "C"], ["D", "F"], ["D", "E"], ["F", "E"], ["B", "C"]];
    const POSITIONS = { A: [75, 240], B: [220, 100], C: [220, 380], D: [480, 100], E: [480, 380], F: [625, 240] };
    const adjacency = Object.fromEntries(VERTICES.map((vertex) => [vertex, []]));
    EDGES.forEach(([left, right]) => { adjacency[left].push(right); adjacency[right].push(left); });
    const state = { algorithm: "BFS", frames: [], cursor: 0, timer: null, start: "A" };
    const svg = document.querySelector("#graph-svg");
    const edgeKey = (left, right) => [left, right].sort().join("");

    function snapshot(label, visited, frontier, order, current, activeEdge, note) {
      state.frames.push({ label, visited: [...visited], frontier: [...frontier], order: [...order], current, activeEdge, note });
    }

    function buildBfs(start) {
      const visited = new Set();
      const discovered = new Set([start]);
      const queue = [start];
      const order = [];
      snapshot(`起點 ${start} 入列`, visited, queue, order, start, null, `從 ${start} 開始，將起點放入佇列。`);
      while (queue.length) {
        const vertex = queue.shift();
        visited.add(vertex);
        order.push(vertex);
        snapshot(`走訪 ${vertex}`, visited, queue, order, vertex, null, `取出佇列首端的 ${vertex} 並標記為已走訪。`);
        for (const neighbor of adjacency[vertex]) {
          if (discovered.has(neighbor)) continue;
          discovered.add(neighbor);
          queue.push(neighbor);
          snapshot(`發現 ${neighbor}`, visited, queue, order, vertex, [vertex, neighbor], `沿著 ${vertex}–${neighbor} 發現新頂點 ${neighbor}，加入佇列尾端。`);
        }
      }
      snapshot("BFS 完成", visited, queue, order, null, null, "佇列已空，所有可到達頂點都已走訪。" );
    }

    function buildDfs(start) {
      const visited = new Set();
      const stack = [];
      const order = [];
      function visit(vertex, parent = null) {
        visited.add(vertex);
        stack.push(vertex);
        order.push(vertex);
        snapshot(`走訪 ${vertex}`, visited, stack, order, vertex, parent ? [parent, vertex] : null, parent ? `沿著 ${parent}–${vertex} 深入走訪 ${vertex}。` : `從起點 ${vertex} 開始深度優先走訪。`);
        for (const neighbor of adjacency[vertex]) {
          if (!visited.has(neighbor)) visit(neighbor, vertex);
        }
        stack.pop();
        snapshot(`回溯 ${vertex}`, visited, stack, order, stack.at(-1) || null, null, stack.length ? ` ${vertex} 的鄰點已檢查，回到 ${stack.at(-1)}。` : "所有可到達頂點都已走訪。" );
      }
      visit(start);
      snapshot("DFS 完成", visited, stack, order, null, null, "所有可到達頂點都已走訪。" );
    }

    function svgElement(name, attrs = {}) {
      const element = document.createElementNS("http://www.w3.org/2000/svg", name);
      Object.entries(attrs).forEach(([key, value]) => element.setAttribute(key, String(value)));
      return element;
    }

    function renderGraph(frame = null) {
      svg.replaceChildren();
      const visited = new Set(frame?.visited || []);
      const frontier = new Set(frame?.frontier || []);
      const active = frame?.activeEdge ? edgeKey(...frame.activeEdge) : null;
      const visitedEdges = new Set();
      if (frame) {
        for (const vertex of visited) {
          for (const neighbor of adjacency[vertex]) {
            if (visited.has(neighbor)) visitedEdges.add(edgeKey(vertex, neighbor));
          }
        }
      }
      EDGES.forEach(([left, right]) => {
        const [x1, y1] = POSITIONS[left];
        const [x2, y2] = POSITIONS[right];
        const key = edgeKey(left, right);
        const className = key === active ? "edge active" : visitedEdges.has(key) ? "edge visited" : "edge";
        svg.append(svgElement("line", { x1, y1, x2, y2, class: className }));
      });
      VERTICES.forEach((vertex) => {
        const [x, y] = POSITIONS[vertex];
        const group = svgElement("g", { transform: `translate(${x} ${y})` });
        let tone = "";
        if (frame?.current === vertex) tone = "current";
        else if (visited.has(vertex)) tone = "visited";
        else if (frontier.has(vertex)) tone = "discovered";
        group.append(svgElement("circle", { r: 27, class: `node ${tone}` }));
        const label = svgElement("text", { class: "node-label", y: 1 });
        label.textContent = vertex;
        group.append(label);
        svg.append(group);
      });
    }

    function renderHistory() {
      const list = document.querySelector("#history-list");
      list.replaceChildren();
      state.frames.forEach((frame, index) => {
        const row = document.createElement("div");
        row.className = `history-row${index === state.cursor ? " active" : ""}`;
        const number = document.createElement("span");
        number.className = "history-index";
        number.textContent = String(index + 1).padStart(2, "0");
        const label = document.createElement("span");
        label.textContent = frame.label;
        row.append(number, label);
        list.append(row);
      });
      list.scrollTop = list.scrollHeight;
      document.querySelector("#history-count").textContent = `${state.frames.length} 步`;
    }

    function render() {
      const frame = state.frames[state.cursor];
      document.querySelector("#algorithm-label").textContent = state.algorithm;
      document.querySelector("#frontier-label").textContent = state.algorithm === "BFS" ? "佇列（下一個先走）" : "遞迴堆疊（目前路徑）";
      document.querySelector("#current-node").textContent = frame?.current || "—";
      document.querySelector("#visited-count").textContent = `${frame?.visited.length || 0} / ${VERTICES.length}`;
      document.querySelector("#frontier-list").textContent = frame?.frontier.length ? frame.frontier.join(" → ") : "—";
      document.querySelector("#order-list").textContent = frame?.order.length ? frame.order.join(" → ") : "尚未開始";
      document.querySelector("#step-note").textContent = frame?.note || "選擇 BFS 或 DFS 和起點，再開始走訪。";
      document.querySelector("#previous-button").disabled = state.cursor === 0;
      document.querySelector("#next-button").disabled = state.cursor >= state.frames.length - 1;
      document.querySelector("#play-button").disabled = state.frames.length < 2;
      document.querySelector("#reset-button").disabled = state.frames.length < 2;
      document.querySelector("#step-count").textContent = state.frames.length ? `${state.cursor + 1} / ${state.frames.length}` : "0 / 0";
      document.querySelector("#progress-fill").style.width = state.frames.length < 2 ? "0%" : `${state.cursor / (state.frames.length - 1) * 100}%`;
      renderGraph(frame);
      renderHistory();
    }

    function stopPlayback() {
      if (state.timer) clearInterval(state.timer);
      state.timer = null;
      document.querySelector("#play-button").textContent = "▶ 自動播放";
      document.querySelector("#play-button").setAttribute("aria-pressed", "false");
    }

    function startTraversal() {
      stopPlayback();
      state.start = document.querySelector("#start-vertex").value;
      state.frames = [];
      state.cursor = 0;
      if (state.algorithm === "BFS") buildBfs(state.start);
      else buildDfs(state.start);
      render();
    }

    document.querySelector("#bfs-button").addEventListener("click", () => {
      state.algorithm = "BFS";
      document.querySelector("#bfs-button").setAttribute("aria-pressed", "true");
      document.querySelector("#dfs-button").setAttribute("aria-pressed", "false");
      renderGraph(null);
      document.querySelector("#frontier-label").textContent = "佇列（下一個先走）";
    });
    document.querySelector("#dfs-button").addEventListener("click", () => {
      state.algorithm = "DFS";
      document.querySelector("#bfs-button").setAttribute("aria-pressed", "false");
      document.querySelector("#dfs-button").setAttribute("aria-pressed", "true");
      renderGraph(null);
      document.querySelector("#frontier-label").textContent = "遞迴堆疊（目前路徑）";
    });
    document.querySelector("#start-button").addEventListener("click", startTraversal);
    document.querySelector("#previous-button").addEventListener("click", () => { stopPlayback(); state.cursor = Math.max(0, state.cursor - 1); render(); });
    document.querySelector("#next-button").addEventListener("click", () => { stopPlayback(); state.cursor = Math.min(state.frames.length - 1, state.cursor + 1); render(); });
    document.querySelector("#reset-button").addEventListener("click", startTraversal);
    document.querySelector("#play-button").addEventListener("click", () => {
      if (state.timer) { stopPlayback(); return; }
      if (state.cursor >= state.frames.length - 1) state.cursor = 0;
      const button = document.querySelector("#play-button");
      button.textContent = "Ⅱ 暫停";
      button.setAttribute("aria-pressed", "true");
      render();
      state.timer = setInterval(() => {
        if (state.cursor >= state.frames.length - 1) { stopPlayback(); return; }
        state.cursor += 1;
        render();
      }, 650);
    });

    renderGraph(null);
    render();
  </script>
</body>
</html>
