<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#edf2f6">
  <title>最短路徑｜Dijkstra 演算法</title>
  <style>
    :root{color-scheme:light;--ink:#24384b;--muted:#728496;--paper:#edf2f6;--white:#fff;--blue:#3478a0;--teal:#258b78;--orange:#c86b34;--red:#c93b3b;--line:#dce5eb;--shadow:0 3px 12px #29475d12,0 12px 28px #29475d0a}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:var(--paper);font-family:"Microsoft JhengHei","PingFang TC",sans-serif}
    button{font:inherit;color:inherit}.page{width:min(1360px,100%);margin:auto;padding:18px 26px 32px}.nav{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:15px;padding:0 4px 10px}.nav a{color:var(--blue);font-size:12px;font-weight:700;text-decoration:none}
    .toolbar,.controls,.panel{border:1px solid #e0e7ed;border-radius:9px;background:var(--white);box-shadow:var(--shadow)}.toolbar{display:flex;min-height:68px;align-items:center;justify-content:space-between;gap:16px;padding:13px 18px}.brand{display:flex;align-items:center;gap:12px}.brand-mark{display:grid;width:40px;height:40px;place-items:center;border-radius:8px;color:#fff;background:var(--ink);font-size:12px;font-weight:900}
    h1{margin:0;font-size:20px}.subtitle{margin-top:4px;color:var(--muted);font-size:11px}.graph-facts{padding:9px 12px;border-radius:6px;background:#e8eef3;color:var(--muted);font-size:11px}
    .controls{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;padding:12px 16px}.control-group,.control-actions{display:flex;align-items:center;gap:8px}.control-label{color:var(--muted);font-size:11px}
    select,.button{height:38px;border:1px solid #d1dce4;border-radius:5px;background:#fff;padding:0 12px;color:var(--ink);font-size:11px;font-weight:800}.button{border:0;background:#e7edf2;cursor:pointer}.button-dark{color:#fff;background:var(--ink)}
    h2{margin:0;font-size:13px}.panel-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.meta{color:var(--muted);font-size:10px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;margin-top:12px}.panel{min-width:0;padding:14px}
    .graph-stage{height:410px;overflow:auto;border:1px solid #d0dbe4;border-radius:6px;background:#dce5ed}.graph-stage svg{display:block;width:100%;min-width:620px;height:100%}
    .edge{stroke:#aab9c4;stroke-width:3}.edge.selected{stroke:var(--teal);stroke-width:5}.edge.problem{stroke:var(--red);stroke-width:4;stroke-dasharray:9 7}.node{fill:#fff;stroke:#8fa3b3;stroke-width:3}.node.current{fill:#fff;stroke:var(--teal);stroke-width:7}.node.problem{fill:#fff;stroke:var(--red);stroke-width:7}.node-label{fill:var(--ink);font-size:20px;font-weight:900;text-anchor:middle;dominant-baseline:central}.weight{fill:var(--blue);font-size:15px;font-weight:900;text-anchor:middle;paint-order:stroke;stroke:#dce5ed;stroke-width:6px}
    .edge-hit{stroke:transparent;stroke-width:24;cursor:pointer}.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin:10px 0 13px}.metric{padding:9px;border-radius:5px;background:#e8eef3;color:var(--muted);font-size:10px}.metric strong{display:block;margin-top:4px;color:var(--ink);font-size:15px}.info-label{display:block;margin:10px 0 5px;color:var(--muted);font-size:10px}.info-strip{min-height:34px;padding:9px;border-radius:5px;background:#edf2f6;font-size:11px;font-weight:700;line-height:1.5}.note{min-height:40px;margin:8px 0 0;color:var(--muted);font-size:11px;line-height:1.6}
    .section{margin-top:14px;padding:18px;border:1px solid #e0e7ed;border-radius:9px;background:#fff;box-shadow:var(--shadow)}.section-head p{margin:7px 0 12px;color:var(--muted);font-size:11px;line-height:1.6}.example-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{padding:12px;border:1px solid #dce5eb;border-radius:9px}.card.good{border-left:3px solid var(--teal)}.card.bad{border-left:3px solid var(--red)}.card svg{width:100%;height:220px}.card-note{min-height:74px;color:var(--muted);font-size:11px;line-height:1.65}.good-text{color:var(--teal)}.bad-text{color:var(--red)}
    @media(max-width:820px){.page{padding:12px}.workspace{grid-template-columns:1fr}.example-grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.toolbar{align-items:flex-start;flex-direction:column}.example-grid{grid-template-columns:1fr}.graph-stage{height:360px}}
  </style>
</head>
<body>
  <main class="page">
    <nav class="nav" aria-label="其他作業">
      <a href="index.html">二元搜尋樹</a><a href="max-heap.html">最大堆積樹</a><a href="hash-table.html">雜湊表</a><a href="graph-traversal.html">圖形走訪</a>
    </nav>
    <header class="toolbar">
      <div class="brand"><div class="brand-mark">S</div><div><h1>最短路徑</h1><div class="subtitle">SHORTEST PATH · DIJKSTRA 演算法</div></div></div>
      <div class="graph-facts">6 個頂點 · Dijkstra</div>
    </header>
    <section class="controls">
      <div class="control-group"><span class="control-label">起點</span><select id="startNode"><option>S</option><option>A</option><option>B</option></select><span class="control-label">終點</span><select id="endNode"><option>G</option><option>C</option><option>E</option></select></div>
      <div class="control-actions"><button id="resetButton" class="button">重新開始</button><button id="stepButton" class="button button-dark">下一步</button></div>
    </section>
    <div class="workspace">
      <section class="panel">
        <div class="panel-heading"><h2>加權無向圖</h2><span class="meta">Dijkstra 模擬</span></div>
        <div class="graph-stage"><svg id="graph" viewBox="0 0 760 410" aria-label="最短路徑示意圖"></svg></div>
      </section>
      <aside><section class="panel">
        <div class="panel-heading"><h2>演算狀態</h2><span class="meta" id="stateMeta">準備</span></div>
        <div class="summary"><div class="metric">目前頂點<strong id="currentNode">—</strong></div><div class="metric">已完成<strong id="visitedCount">0 / 6</strong></div></div>
        <span class="info-label">目前距離</span><div class="info-strip" id="distanceList">尚未開始</div>
        <span class="info-label">目前路徑</span><div class="info-strip" id="pathList">尚未開始</div>
        <p class="note" id="stepNote">選擇起點與終點，再執行 Dijkstra 演算法。</p>
      </section></aside>
    </div>
    <section class="section">
      <div class="section-head"><h2>把問題說清楚：輸入什麼、輸出什麼</h2><p>在畫出路徑前，比較候選邊與目前記錄的距離。</p></div>
      <div class="example-grid" id="conceptExamples"></div>
    </section>
    <section class="section">
      <div class="section-head"><h2>鬆弛長什麼樣：一次只看一條邊</h2><p>Dijkstra 每次從已確定的頂點對鄰點鬆弛，若找到更短路徑就更新。</p></div>
      <div class="example-grid" id="relaxExamples"></div>
    </section>
  </main>
  <script src="shortest-path.js"></script>
</body>
</html>
