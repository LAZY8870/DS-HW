<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#edf2f6">
  <title>最短路徑｜開始遊玩</title>
  <style>
    :root{color-scheme:light;--ink:#24384b;--muted:#728496;--paper:#edf2f6;--white:#fff;--blue:#3478a0;--teal:#258b78;--orange:#c86b34;--red:#c93b3b;--line:#dce5eb;--shadow:0 3px 12px #29475d12,0 12px 28px #29475d0a}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:var(--paper);font-family:"Microsoft JhengHei","PingFang TC",sans-serif;font-size:13px}
    button,select{font:inherit;color:inherit}.page{width:min(1360px,100%);margin:auto;padding:18px 26px 32px}.nav{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:15px;padding:0 4px 10px}.nav a{color:var(--blue);font-size:12px;font-weight:700;text-decoration:none}
    .top-note{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}.step-num{display:grid;width:28px;height:28px;place-items:center;border-radius:4px;background:#dde8ed;color:var(--orange);font-size:11px;font-weight:900}.top-note strong{display:block;font-size:15px}.top-note p{margin:3px 0 0;color:var(--muted);font-size:11px}
    .card{border:1px solid #e0e7ed;border-radius:9px;background:var(--white);box-shadow:var(--shadow)}.tabs-card{margin-bottom:12px;padding:14px 16px}.tabs{display:flex;gap:4px;padding:4px;width:max-content;border-radius:99px;background:#e8eef3}.tab{height:32px;padding:0 16px;border:0;border-radius:99px;background:transparent;cursor:pointer;font-size:11px;font-weight:800}.tab.active{background:#fff;box-shadow:0 1px 5px #29475d1a;color:var(--ink)}
    .mode-card{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding:11px 14px}.mode-left,.route-picker,.route-end{display:flex;align-items:center;gap:8px}.mode-label,.meta{color:var(--muted);font-size:10px}.segmented{display:flex;gap:4px}.segmented button{height:27px;padding:0 10px;border:1px solid transparent;border-radius:99px;background:#edf2f5;cursor:pointer;font-size:10px;font-weight:800}.segmented button.active{border-color:var(--orange);background:#fff;color:#a95220}
    .route-picker .arrow{color:var(--orange);font-weight:900}.node-chip{display:inline-grid;height:25px;min-width:25px;place-items:center;padding:0 8px;border:1px solid #dbe4ea;border-radius:99px;background:#fff;font-weight:900}.node-chip.target{border-color:#f0c4a0;background:#fff7ef;color:#a95220}
    .workspace{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;margin-bottom:12px}.play-panel{padding:14px}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.panel-title{font-size:13px;font-weight:900}.graph-count{color:var(--muted);font-size:10px}
    .graph-wrap{height:390px;border:1px solid #d3dde3;border-radius:7px;background:#fff}.graph-wrap svg{width:100%;height:100%}.edge{stroke:#c9d3d9;stroke-width:2.5}.edge.selected{stroke:var(--teal);stroke-width:4}.edge.problem{stroke:var(--red);stroke-width:4;stroke-dasharray:9 7}.node{fill:#fff;stroke:#9dafbb;stroke-width:2}.node.current{stroke:var(--orange);stroke-width:4}.node.done{stroke:var(--teal);stroke-width:4}.node-label{fill:var(--ink);font-size:18px;font-weight:900;text-anchor:middle;dominant-baseline:central}.node-kind{fill:var(--orange);font-size:9px;text-anchor:middle}.weight{fill:var(--blue);font-size:13px;font-weight:900;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:5px}
    .legend-row{display:flex;align-items:center;justify-content:center;gap:18px;min-height:38px;color:var(--muted);font-size:10px}.legend-item{display:inline-flex;align-items:center;gap:5px}.legend-dot{width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid #9dafbb}.legend-dot.orange{border-color:var(--orange)}.legend-dot.teal{border-color:var(--teal)}.legend-dot.red{border-color:var(--red)}.legend-line{width:18px;height:3px;border-radius:2px;background:var(--teal)}
    .control-row{display:flex;align-items:center;gap:8px}.button{height:32px;padding:0 13px;border:0;border-radius:5px;background:#edf1f4;cursor:pointer;font-size:10px;font-weight:800}.button.dark{color:#fff;background:var(--ink)}.button:disabled{cursor:not-allowed;opacity:.45}.step-count{margin-left:auto;color:var(--muted);font-size:10px}
    .message-strip{margin-top:10px;padding:11px 13px;border-left:3px solid #a8cde2;border-radius:5px;background:#edf3f7;font-size:11px;line-height:1.7}.message-strip strong{color:var(--blue)}
    .side{display:flex;flex-direction:column;gap:12px}.mini-card{padding:14px}.next-button{width:100%;height:36px;border:0;border-radius:5px;background:var(--orange);color:#fff;cursor:pointer;font-size:11px;font-weight:900}
    .relax-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.mini{padding:9px;border-radius:5px;background:#edf2f6;text-align:center;color:var(--muted);font-size:10px}.mini strong{display:block;margin-top:4px;color:var(--ink);font-size:13px}.pill{display:inline-flex;margin-left:8px;padding:3px 8px;border-radius:99px;background:#eef2f5;color:var(--teal);font-size:10px}
    .table{width:100%;margin-top:10px;border-collapse:collapse;font-size:10px}.table th,.table td{padding:7px;border-bottom:1px solid #e8edf1;text-align:center}.table th{background:#edf2f5;color:var(--muted)}.table td:first-child{font-weight:900}.table tr.current{outline:1px solid #c7dce6}
    .explain{margin-top:12px;padding:16px 18px}.explain-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}.example{padding:12px;border:1px solid #dce5eb;border-radius:8px}.example svg{width:100%;height:210px}.example-note{min-height:65px;color:var(--muted);font-size:10px;line-height:1.6}.example.good{border-left:3px solid var(--teal)}.example.bad{border-left:3px solid var(--red)}.good-text{color:var(--teal)}.bad-text{color:var(--red)}
    @media(max-width:900px){.workspace{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}.explain-grid{grid-template-columns:1fr 1fr}}@media(max-width:620px){.page{padding:12px}.mode-card{align-items:flex-start;flex-direction:column}.route-picker{flex-wrap:wrap}.side,.explain-grid{grid-template-columns:1fr}.graph-wrap{height:340px}}
  </style>
</head>
<body>
  <main class="page">
    <nav class="nav" aria-label="其他作業"><a href="index.html">二元搜尋樹</a><a href="max-heap.html">最大堆積樹</a><a href="hash-table.html">雜湊表</a><a href="graph-traversal.html">圖形走訪</a></nav>
    <div class="top-note"><div class="step-num">02</div><div><strong>開始玩</strong><p>選模式 → 一步一步走 → 看優先佇列先進哪些下一個節點。</p></div></div>
    <section class="card tabs-card"><div class="tabs"><button class="tab active" id="demoTab">演示模式</button><button class="tab" id="gameTab">關卡模式</button></div></section>
    <section class="card mode-card">
      <div class="mode-left"><span class="mode-label">模式</span><div class="segmented"><button class="active" data-mode="full">Dijkstra 完整演示</button><button data-mode="relax">鬆弛解析</button></div></div>
      <div class="route-picker"><span class="mode-label">起點</span><select id="startNode"><option>A</option><option>S</option><option>B</option></select><span class="arrow">→</span><span class="mode-label">終點</span><select id="endNode"><option>F</option><option>E</option><option>G</option></select><span class="arrow">→</span><span class="node-chip target">A</span><span class="arrow">→</span><span class="node-chip" id="arrowLabel">F</span></div>
    </section>
    <div class="workspace">
      <section class="card play-panel">
        <div class="panel-head"><span class="panel-title">加權無向圖</span><span class="graph-count">6 頂點 · 8 邊</span></div>
        <div class="graph-wrap"><svg id="graph" viewBox="0 0 760 390" aria-label="加權無向圖"></svg></div>
        <div class="legend-row"><span class="legend-item"><i class="legend-dot orange"></i>正在處理</span><span class="legend-item"><i class="legend-dot teal"></i>已完成</span><span class="legend-item"><i class="legend-dot red"></i>候選邊</span><span class="legend-item"><i class="legend-line"></i>已到路徑</span></div>
        <div class="control-row"><button class="button" id="prevButton">← 上一步</button><button class="button dark" id="nextButton">下一步 ▶</button><button class="button" id="autoButton">▶ 自動播放</button><button class="button" id="resetButton">↻ 重置</button><span class="step-count" id="stepCount">0 / 25</span></div>
        <div class="message-strip" id="messageStrip"><strong>START</strong><br><b>初始化</b>：dist[A] = 0；其餘 ∞。</div>
      </section>
      <aside class="side">
        <section class="card mini-card"><button class="next-button" id="sideNextButton">(G, A) ← 下一個邊鬆弛</button><div class="relax-grid"><div class="mini">鬆弛次數<strong id="relaxCount">0</strong></div><div class="mini">更新次數<strong id="updateCount">0</strong></div><div class="mini">最短路徑<strong id="shortestLength">—</strong></div><div class="mini">完成節點<strong id="doneCount">0</strong></div></div></section>
        <section class="card mini-card">
          <div class="panel-head"><span class="panel-title">DIST / PARENT 表</span><span class="meta">狀態</span></div>
          <table class="table"><thead><tr><th>節點</th><th>DIST</th><th>PARENT</th><th>狀態</th></tr></thead><tbody id="distTable"></tbody></table>
        </section>
      </aside>
    </div>
    <section class="card explain">
      <div class="panel-head"><span class="panel-title">為何這是最短路徑</span><span class="meta">把 Dijkstra 與直接比較並排</span></div>
      <div class="explain-grid" id="exampleGrid"></div>
    </section>
  </main>
  <script src="shortest-path.js"></script>
</body>
</html>
